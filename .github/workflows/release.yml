name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release.ps1 通过 git tag 解析版本号，需要完整标签历史
          fetch-depth: 0

      - name: Build & package
        shell: pwsh
        run: tools\release.ps1 -Tag ${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
