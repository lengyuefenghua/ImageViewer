<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageViewer 安装向导 · Inno Setup 风格 Demo</title>
<style>
:root{font:14px/1.5 "Segoe UI",Arial,"Microsoft YaHei",sans-serif;color:#202124;background:#eef1f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(760px,100%);border:1px solid #b8c0ca;border-radius:7px;background:#fff;box-shadow:0 18px 54px #192a3e26;overflow:hidden}.titlebar{height:42px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;background:#f5f6f8;border-bottom:1px solid #d5d9df;color:#30343a;font-size:13px}.title{display:flex;align-items:center;gap:9px}.icon{width:19px;height:19px;display:grid;place-items:center;border-radius:4px;background:linear-gradient(140deg,#73d9df,#4380e9);color:#10233d;font-weight:bold}.close{font-size:18px;color:#5d626b}.hero{min-height:110px;padding:23px 30px 20px;background:linear-gradient(110deg,#f5f9ff,#edf4fc);border-bottom:1px solid #dce2e9}.eyebrow{font-size:11px;font-weight:650;letter-spacing:.13em;color:#4274bd;text-transform:uppercase}.hero h1{margin:4px 0 3px;font-size:22px;font-weight:600;letter-spacing:-.02em}.hero p{margin:0;color:#5e6672;font-size:13px}.body{min-height:294px;padding:27px 30px 22px}.body h2{margin:0 0 7px;font-size:16px;font-weight:600}.body .intro{margin:0 0 21px;color:#606873}.welcome{display:flex;align-items:center;gap:25px}.welcome-text{flex:1}.illustration{width:156px;height:138px;display:grid;place-items:center;flex:0 0 auto}.picture{position:relative;width:104px;height:111px;border:1px solid #c1d0df;border-radius:5px;background:linear-gradient(160deg,#d5eff2,#a9d4ee 55%,#6698c7);box-shadow:0 8px 18px #203c5b20}.picture:before{content:"";position:absolute;top:19px;left:55px;width:22px;height:22px;border-radius:50%;background:#f9e6a4}.picture:after{content:"";position:absolute;left:11px;right:10px;bottom:9px;height:52px;background:linear-gradient(145deg,transparent 43%,#507796 44%),linear-gradient(35deg,#5a8b9e 43%,transparent 44%),linear-gradient(150deg,transparent 49%,#86b895 50%);clip-path:polygon(0 100%,0 72%,33% 28%,55% 58%,75% 14%,100% 73%,100% 100%)}.field{margin:13px 0 6px;font-weight:600}.inputrow{display:flex;gap:8px}.inputrow input{height:34px;min-width:0;flex:1;padding:6px 9px;border:1px solid #aeb7c2;border-radius:3px;color:#30343a;background:#fff;font:13px inherit}.inputrow input:focus{outline:2px solid #84afe8;outline-offset:1px}.button{height:34px;padding:0 12px;border:1px solid #aeb7c2;border-radius:3px;background:linear-gradient(#fff,#f2f3f5);color:#202124;cursor:pointer}.button:hover{background:#eaf2fc}.hint{font-size:12px;color:#68717c;margin:6px 0 17px}.option{display:flex;align-items:flex-start;gap:9px;margin:12px 0;cursor:pointer}.option input{margin-top:3px;accent-color:#2673d8}.option span{color:#343942}.option small{display:block;color:#727b85;margin-top:2px}.summary{width:min(500px,100%);border-collapse:collapse}.summary th,.summary td{padding:10px 9px;border-bottom:1px solid #e7e9ec;text-align:left;vertical-align:top}.summary th{width:145px;color:#606873;font-weight:500}.summary td{overflow-wrap:anywhere}.progress{height:13px;margin:22px 0 8px;border:1px solid #b8c2ce;border-radius:2px;background:#f2f4f6;overflow:hidden}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#4389e9,#6dbdc7);transition:width .3s}.progress-caption{font-size:12px;color:#606873;display:flex;justify-content:space-between}.success{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#e7f5ed;border:1px solid #b8dec7;color:#328454;font-size:23px;margin-bottom:14px}.footer{min-height:58px;padding:11px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f6f8;border-top:1px solid #d5d9df}.footnote{font-size:11px;color:#747c86}.actions{display:flex;gap:8px}.actions button{min-width:82px}.primary{border-color:#2873ce;background:linear-gradient(#4b91e8,#2874d3);color:#fff;font-weight:600}.primary:hover{background:#216bc7}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,10px);opacity:0;transition:.2s;padding:8px 12px;border:1px solid #c1cad5;border-radius:4px;background:#fff;box-shadow:0 3px 14px #2222}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){body{padding:9px}.hero{padding:17px 19px}.body{padding:20px 19px;min-height:300px}.illustration{width:100px;transform:scale(.8)}.welcome{gap:10px}.footer{align-items:flex-end}.footnote{max-width:120px}.actions button{min-width:65px;padding:0 8px}}
</style>
</head>
<body><section class="shell" aria-label="ImageViewer 安装向导原型">
<header class="titlebar"><div class="title"><span class="icon" aria-hidden="true">▧</span><span>ImageViewer 安装</span></div><span class="close" aria-hidden="true">×</span></header>
<div class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="heading"></h1><p id="lead"></p></div>
<main class="body" id="body" aria-live="polite"></main>
<footer class="footer"><span class="footnote">Inno Setup 标准向导概念稿 · 实际控件以安装器为准</span><div class="actions"><button class="button" id="cancel">取消</button><button class="button" id="back">上一步</button><button class="button primary" id="next">下一步 &gt;</button></div></footer>
</section><div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const pages=[
{label:'欢迎',title:'欢迎使用 ImageViewer 安装向导',lead:'本向导将引导你完成 ImageViewer 的安装。',html:`<div class="welcome"><div class="welcome-text"><h2>开始安装</h2><p class="intro">ImageViewer 是一款轻量、专注的 Windows 图片查看器。继续前建议关闭正在运行的 ImageViewer。</p><p>点击“下一步”继续，或点击“取消”退出安装。</p></div><div class="illustration" aria-hidden="true"><div class="picture"></div></div></div>`},
{label:'安装位置',title:'选择安装位置',lead:'ImageViewer 将以管理员权限为这台电脑的所有用户安装。',html:`<h2>安装文件夹</h2><p class="intro">安装程序会以管理员权限为这台电脑的所有用户安装 ImageViewer。</p><div class="field"><label for="path">安装文件夹</label></div><div class="inputrow"><input id="path" value="%ProgramFiles%\\ImageViewer" aria-label="安装文件夹"><button class="button" id="browse">浏览…</button></div><p class="hint">默认安装目录不包含版本号，不同版本使用同一安装位置。</p><label class="option"><input id="associations" type="checkbox" checked><span>注册 ImageViewer 为图片打开方式<small>默认勾选；注册 jpg/jpeg/png/bmp 的打开候选，不会强制修改系统默认应用</small></span></label><label class="option"><input id="desktop" type="checkbox"><span>创建桌面快捷方式<small>可选，便于从桌面启动</small></span></label><p class="hint">安装程序会在开始菜单的 ImageViewer 程序组中创建快捷方式。</p>`},
{label:'确认安装',title:'准备安装 ImageViewer',lead:'请确认安装设置。',html:`<h2>安装摘要</h2><p class="intro">点击“安装”后开始复制程序文件。</p><table class="summary"><tr><th>安装范围</th><td>所有用户（管理员权限）</td></tr><tr><th>安装位置</th><td id="sumPath"></td></tr><tr><th>注册图片打开方式</th><td id="sumAssociations"></td></tr><tr><th>桌面快捷方式</th><td id="sumDesk"></td></tr><tr><th>平台</th><td>Windows x64</td></tr></table>`},
{label:'安装中',title:'正在安装 ImageViewer',lead:'请稍候，安装程序正在复制文件。',html:`<h2 id="progressText">正在准备安装…</h2><div class="progress"><span id="bar"></span></div><div class="progress-caption"><span>安装进度（原型模拟）</span><span id="percent">0%</span></div><p class="hint">此页面仅模拟安装进度，不会修改电脑或写入程序文件。</p>`},
{label:'完成',title:'ImageViewer 安装完成',lead:'安装向导已成功完成。',html:`<div class="success" aria-hidden="true">✓</div><h2>感谢使用 ImageViewer</h2><p class="intro">可以从开始菜单或桌面快捷方式启动。首次运行时，应用仍会显示自己的默认查看器设置引导。</p><label class="option"><input type="checkbox" id="launch"><span>完成后启动 ImageViewer<small>原型选项；不会实际启动程序</small></span></label>`}
];
let page=0,timer=null;const choice={path:'%ProgramFiles%\\ImageViewer',associations:true,desktop:false};const $=id=>document.getElementById(id);
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function updatePath(e){if(e.target.id==='path')choice.path=e.target.value;if(e.target.id==='associations')choice.associations=e.target.checked;if(e.target.id==='desktop')choice.desktop=e.target.checked}function render(){const p=pages[page];$('eyebrow').textContent=`安装步骤 ${page+1} / ${pages.length} · ${p.label}`;$('heading').textContent=p.title;$('lead').textContent=p.lead;$('body').innerHTML=p.html;if(page===1){$('path').value=choice.path;$('associations').checked=choice.associations;$('desktop').checked=choice.desktop}if(page===2){$('sumPath').textContent=choice.path;$('sumAssociations').textContent=choice.associations?'是':'否';$('sumDesk').textContent=choice.desktop?'是':'否'}$('back').classList.toggle('hidden',page===0||page===3||page===4);$('cancel').classList.toggle('hidden',page===4);$('next').classList.toggle('hidden',page===3);$('next').textContent=page===2?'安装 ›':page===4?'完成':'下一步 ›';$('back').disabled=page===3;if(page===3)progress()}
document.addEventListener('change',updatePath);document.addEventListener('input',updatePath);
 function progress(){clearInterval(timer);let n=0;timer=setInterval(()=>{n=Math.min(100,n+10);$('bar').style.width=n+'%';$('percent').textContent=n+'%';$('progressText').textContent=n<45?'正在复制程序文件…':n<85?'正在创建快捷方式…':'正在完成安装…';if(n===100){clearInterval(timer);setTimeout(()=>{page=4;render()},350)}},220)}
$('next').addEventListener('click',()=>{if(page===1){const value=$('path').value.trim();if(!value||/[<>"|?*]/.test(value)){toast('请检查安装路径');$('path').focus();return}choice.path=value;choice.associations=$('associations').checked;choice.desktop=$('desktop').checked}if(page===2){page=3;render();return}if(page<2){page++;render()}else if(page===4)toast('原型演示结束')});
$('back').addEventListener('click',()=>{if(page===2){choice.path=$('path')?.value||choice.path;choice.desktop=$('desktop')?.checked??choice.desktop}if(page>0&&page<3){page--;render()}});
$('cancel').addEventListener('click',()=>{clearInterval(timer);page=0;render();toast('已取消原型演示')});document.addEventListener('click',e=>{if(e.target.id==='browse')toast('请在原型中直接编辑路径')});render();
})();
</script></body></html>
